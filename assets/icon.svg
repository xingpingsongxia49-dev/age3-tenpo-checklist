<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    ホーム画面に出すアプリアイコン。
    いただいたデザイン（クリップボード＋いちごサンド＋「アゲサン」）を
    そのまま置ける形にした版。ラスタ画像は scripts/make-icons.mjs で書き出す。
    色：地=白／線=#2B2B2B／差し色=#E2766B（既存アプリのコーラル）
  -->
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- 絵の部分。文字とぶつからないよう少し上に寄せる -->
  <g transform="translate(0,-32)">

  <!-- クリップボード -->
  <g stroke="#2B2B2B" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="96" y="120" width="232" height="252" rx="26" stroke-width="19"/>
  </g>
  <g fill="#2B2B2B">
    <rect x="168" y="98" width="88" height="40" rx="14"/>
    <rect x="190" y="76" width="44" height="34" rx="16"/>
  </g>
  <circle cx="212" cy="94" r="8" fill="#ffffff"/>

  <!-- チェック行（3行） -->
  <g>
    <g stroke="#2B2B2B" fill="none" stroke-width="11" stroke-linejoin="round">
      <rect x="132" y="168" width="40" height="40" rx="7"/>
      <rect x="132" y="240" width="40" height="40" rx="7"/>
      <rect x="132" y="312" width="40" height="40" rx="7"/>
    </g>
    <g stroke="#E2766B" fill="none" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="140,188 154,203 182,166"/>
      <polyline points="140,260 154,275 182,238"/>
      <polyline points="140,332 154,347 182,310"/>
    </g>
    <g fill="#2B2B2B">
      <rect x="200" y="180" width="104" height="15" rx="7.5"/>
      <rect x="200" y="252" width="76" height="15" rx="7.5"/>
      <rect x="200" y="324" width="46" height="15" rx="7.5"/>
    </g>
  </g>

  <!-- 効果線 -->
  <g stroke="#E2766B" stroke-width="15" stroke-linecap="round">
    <line x1="356" y1="130" x2="374" y2="176"/>
    <line x1="404" y1="118" x2="404" y2="168"/>
    <line x1="450" y1="140" x2="424" y2="182"/>
  </g>

  <!-- いちごサンド -->
  <g transform="rotate(-16 336 288)">
    <!-- パン -->
    <ellipse cx="336" cy="288" rx="108" ry="80" fill="#E9AB58" stroke="#6B4326" stroke-width="9"/>
    <g fill="#F6D19A" opacity="0.85">
      <circle cx="288" cy="236" r="5"/>
      <circle cx="330" cy="224" r="4"/>
      <circle cx="378" cy="238" r="5"/>
      <circle cx="404" cy="272" r="4"/>
      <circle cx="272" cy="272" r="4"/>
      <circle cx="300" cy="330" r="4"/>
      <circle cx="366" cy="336" r="5"/>
      <circle cx="404" cy="316" r="4"/>
    </g>
    <!-- 断面のクリーム -->
    <path d="M244 296 C262 256 300 236 342 234 C382 232 412 246 424 268 C420 296 392 318 344 324 C296 330 258 318 244 296 Z"
          fill="#FFFBF2" stroke="#E4D3B4" stroke-width="4"/>
    <!-- いちご3切れ -->
    <g stroke="#B4302A" stroke-width="4" stroke-linejoin="round">
      <path d="M276 300 C270 276 282 256 300 250 C314 268 316 292 306 308 C296 312 284 310 276 300 Z" fill="#E4463F"/>
      <path d="M330 302 C324 276 336 254 355 248 C369 266 371 292 361 310 C350 314 338 312 330 302 Z" fill="#E4463F"/>
      <path d="M384 296 C378 272 390 252 408 246 C422 264 424 288 414 304 C404 308 392 306 384 296 Z" fill="#E4463F"/>
    </g>
    <g fill="#F7ADA6">
      <path d="M286 298 C282 280 290 266 300 262 C309 276 310 292 304 302 C298 304 291 303 286 298 Z"/>
      <path d="M340 300 C336 280 344 264 355 260 C364 274 365 292 359 304 C353 306 345 305 340 300 Z"/>
      <path d="M394 294 C390 276 398 262 408 258 C417 272 418 288 412 298 C406 300 399 299 394 294 Z"/>
    </g>
    <g fill="#FFFFFF" opacity="0.9">
      <path d="M296 296 C293 284 297 274 302 271 C306 280 306 291 303 298 Z"/>
      <path d="M350 298 C347 284 351 274 356 270 C361 280 361 291 357 300 Z"/>
      <path d="M404 292 C401 280 405 270 410 267 C414 276 414 287 411 294 Z"/>
    </g>
  </g>

  </g>

  <!-- 文字 -->
  <text x="256" y="436" text-anchor="middle" fill="#1F1F1F"
        font-family="IPAGothic, 'Hiragino Sans', 'Noto Sans JP', sans-serif"
        font-size="76" font-weight="700" letter-spacing="4"
        stroke="#1F1F1F" stroke-width="3.5" paint-order="stroke">アゲサン</text>
  <text x="256" y="476" text-anchor="middle" fill="#3A3A3A"
        font-family="IPAGothic, 'Hiragino Sans', 'Noto Sans JP', sans-serif"
        font-size="25" letter-spacing="4">店舗チェックアプリ</text>
</svg>
